name: Build Tayyab Filling Station APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate or prepare project files
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository root: $GITHUB_WORKSPACE"
          echo "Files found in repository:"
          find . -type f \( -name package.json -o -name capacitor.config.json -o -name index.html \) -not -path '*/node_modules/*' -not -path '*/android/*' -print | head -200

          PROJECT_DIR=""
          while IFS= read -r file; do
            candidate="$(dirname "$file")"
            if [[ -f "$candidate/capacitor.config.json" && -f "$candidate/www/index.html" ]]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find . -type f -name package.json -not -path '*/node_modules/*' -not -path '*/android/*' | sort)

          # If package/config were not uploaded but the app's www/index.html exists,
          # create the missing Capacitor metadata beside that www folder.
          if [[ -z "$PROJECT_DIR" ]]; then
            while IFS= read -r file; do
              if [[ "$file" == */www/index.html ]]; then
                candidate="$(dirname "$(dirname "$file")")"
                if [[ -f "$candidate/www/index.html" ]]; then
                  PROJECT_DIR="$candidate"
                  break
                fi
              fi
            done < <(find . -type f -path '*/www/index.html' -not -path '*/node_modules/*' -not -path '*/android/*' | sort)
          fi

          # Last fallback: if an index.html was uploaded without a www folder,
          # copy its containing directory into a fresh www folder.
          if [[ -z "$PROJECT_DIR" ]]; then
            APP_HTML="$(find . -type f -name index.html -not -path '*/node_modules/*' -not -path '*/android/*' | sort | head -1 || true)"
            if [[ -n "$APP_HTML" ]]; then
              PROJECT_DIR="$GITHUB_WORKSPACE/.tayyab-build-project"
              mkdir -p "$PROJECT_DIR/www"
              cp -a "$(dirname "$APP_HTML")"/. "$PROJECT_DIR/www/"
            fi
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ERROR: No index.html app source was found in the GitHub repository."
            echo "Upload the complete ZIP contents, including Tayyab_Filling_Station_APK_Cloud_Build/www/index.html, then run Actions again."
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          mkdir -p "$PROJECT_DIR/www"
          if [[ ! -f "$PROJECT_DIR/www/index.html" ]]; then
            echo "ERROR: App source www/index.html is missing in $PROJECT_DIR"
            exit 1
          fi

          if [[ ! -f "$PROJECT_DIR/package.json" ]]; then
            cat > "$PROJECT_DIR/package.json" <<'JSON'
          {
            "name": "tayyab-filling-station-mobile",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.1",
              "@capacitor/core": "^6.2.1"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.2.1"
            }
          }
          JSON
          fi

          if [[ ! -f "$PROJECT_DIR/capacitor.config.json" ]]; then
            cat > "$PROJECT_DIR/capacitor.config.json" <<'JSON'
          {
            "appId": "com.tayyabfillingstation.app",
            "appName": "Tayyab Filling Station",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": { "androidScheme": "https" }
          }
          JSON
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Verify app files
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('capacitor.config.json','utf8')); console.log('JSON files valid')"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm install --no-audit --no-fund

      - name: Prepare Android project
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ ! -d android ]]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tayyab-Filling-Station-APK
          path: '**/android/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
