
name: TAYYAB APK BUILD - CLEAN NO CACHE

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # npm cache intentionally disabled

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check project files
        run: |
          test -f package.json || (echo "ERROR: package.json missing from repository root" && exit 1)
          test -f capacitor.config.json || (echo "ERROR: capacitor.config.json missing from repository root" && exit 1)
          test -f www/index.html || (echo "ERROR: www/index.html missing" && exit 1)
          echo "Project files found."

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check Capacitor
        run: npx cap --version

      - name: Add Android platform if missing
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync Android files
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          echo "APK build completed."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tayyab-Filling-Station-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
