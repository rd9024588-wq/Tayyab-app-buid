name: TAYYAB APK BUILD - CLEAN NO CACHE

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: tayyab-apk-clean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Tayyab Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check required files
        shell: bash
        run: |
          set -euxo pipefail
          pwd
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          echo 'Required source files found.'

      - name: Set up Node (caching disabled)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          package-manager-cache: false

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install npm packages
        shell: bash
        run: |
          set -euxo pipefail
          npm --version
          npm install --no-audit --no-fund --no-package-lock

      - name: Create Android project
        shell: bash
        run: |
          set -euxo pipefail
          npx cap add android

      - name: Sync Capacitor project
        shell: bash
        run: |
          set -euxo pipefail
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tayyab-Filling-Station-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
