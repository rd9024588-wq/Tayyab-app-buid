name: Build Tayyab Filling Station APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate project files
        shell: bash
        run: |
          set -euo pipefail
          echo "Repository root: $GITHUB_WORKSPACE"
          find . -maxdepth 5 -type f \( -name package.json -o -name capacitor.config.json -o -name index.html \) -print
          PROJECT_DIR=""
          while IFS= read -r file; do
            candidate="$(dirname "$file")"
            if [[ -f "$candidate/capacitor.config.json" && -f "$candidate/www/index.html" ]]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find . -type f -name package.json -not -path '*/node_modules/*' -not -path '*/android/*' | sort)
          if [[ -z "$PROJECT_DIR" ]]; then
            echo "ERROR: Could not find a folder containing package.json, capacitor.config.json and www/index.html."
            echo "Upload the project folder contents to the repository and try again."
            exit 1
          fi
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found project: $PROJECT_DIR"

      - name: Verify app files
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          test -f package.json
          test -f capacitor.config.json
          test -f www/index.html
          node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); JSON.parse(require('fs').readFileSync('capacitor.config.json','utf8')); console.log('JSON files valid')"

      - name: Install dependencies
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          npm install --no-audit --no-fund

      - name: Prepare Android project
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          if [[ ! -d android ]]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tayyab-Filling-Station-APK
          path: '**/android/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
